aracterName||p.data?.playerName||'').trim()))throw Error('name');if(!auth.currentUser)await signInAnonymously(auth);let pack=JSON.stringify(clean(store));await set(ref(db,'playerProfiles/'+auth.currentUser.uid),pack);localStorage.setItem(FLAG,'1');last=raw;if(status)status.textContent='✅ 운영자에게 온라인 등록됨 · 수정 내용 자동 갱신';if(button)button.textContent='온라인 등록 갱신'}catch(e){if(status)status.textContent=e.message==='name'?'캐릭터 이름을 먼저 입력해 주세요.':'온라인 등록에 실패했습니다. 인터넷 연결을 확인해 주세요.'}}function attach(){let w=frame.contentWindow,d=frame.contentDocument,inner=d.getElementById('embeddedFrame');if(!inner)return;inner.addEventListener('load',()=>{let x=inner.contentDocument,tools=x.querySelector('.manager .tools');if(!tools||x.getElementById('onlineRegister'))return;button=x.createElement('button');button.id='onlineRegister';button.type='button';button.className='btn primary';button.textContent=localStorage.getItem(FLAG)?'온라인 등록 갱신':'운영자에게 온라인 등록';status=x.createElement('p');status.style.cssText='grid-column:1/-1;margin:8px 0 0;color:#78d0a1;font-weight:800';status.textContent=localStorage.getItem(FLAG)?'온라인 자동 갱신이 켜져 있습니다.':'처음 한 번 누르면 운영자 도감에서 이름과 전투 능력치를 볼 수 있습니다.';tools.append(button,status);button.onclick=()=>upload(true);if(localStorage.getItem(FLAG))upload(false)});w.openCodex('our-rpg-player-status-sheet')}frame.addEventListener('load',attach);setInterval(()=>{if(localStorage.getItem(FLAG)!=='1')return;let raw=localStorage.getItem(KEY)||'';if(raw&&raw!==last)upload(false)},4000);</script></body></html>
