<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>우리들의 RPG · 스토리 운영실</title><style>:root{--bg:#080d0c;--panel:#111a18;--line:#35453f;--text:#edf4ef;--muted:#9fb0a8;--gold:#dfb65b;--red:#ff8989;--purple:#c192df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#33243f 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif;line-height:1.6}.wrap{max-width:1100px;margin:auto;padding:24px 15px 70px}.back{color:var(--gold);text-decoration:none}.hero{margin-top:16px;padding:25px;border:1px solid #75528c;border-radius:18px;background:#17131d}.hero h1{margin:.2em 0}.warn{padding:11px 13px;border:1px solid #8b484c;border-radius:10px;background:#2a1618;color:#ffd1d1}.tools{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto;gap:8px;margin:15px 0;padding:9px;border:1px solid var(--line);border-radius:12px;background:#0b1210ee}input,select,button{font:inherit}input,select{border:1px solid #43554f;border-radius:8px;background:#101916;color:white;padding:10px}button{border:1px solid #6d5680;border-radius:8px;background:#2a1f31;color:white;padding:9px 12px;font-weight:800;cursor:pointer}.stats{color:var(--muted);font-size:.88rem}.grid{display:grid;gap:11px}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:15px}.top{display:flex;gap:10px;align-items:flex-start}.num{display:grid;place-items:center;min-width:40px;height:40px;border-radius:50%;background:#4a2c5d;color:#f1dcff;font-weight:900}.title{flex:1}.title h2{font-size:1rem;margin:0}.title small{color:var(--purple)}.state{width:105px}.truth{margin:12px 0;padding:12px;border-left:3px solid var(--gold);background:#171812}.hints{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{padding:10px;border:1px solid #3b4f47;border-radius:8px;color:#cbd8d1}.actions{display:flex;gap:8px;margin-top:10px}.copy{margin-left:auto}.hide{display:none}@media(max-width:650px){.tools{grid-template-columns:1fr}.top{flex-wrap:wrap}.state{width:100%}.hints{grid-template-columns:1fr}.actions{flex-wrap:wrap}.copy{margin-left:0;width:100%}}</style></head><body><main class="wrap"><a class="back" href="../operator.html">← 운영자 통합 도감</a><header class="hero"><small>OPERATOR ONLY · STORY CONTROL</small><h1>스토리 운영실</h1><p>31~100장 히든 이야기의 진실, 해금 조건과 단계별 힌트를 관리합니다.</p><div class="warn">⚠ 이 페이지의 진실과 정답은 플레이어에게 직접 공개하지 마세요. 플레이어 조건 달성 후 필요한 장만 공개하세요.</div></header><div class="tools"><input id="q" type="search" placeholder="장 번호·제목·시스템 검색"><select id="filter"><option value="all">전체 상태</option><option value="잠김">잠김</option><option value="힌트1">힌트 1 제공</option><option value="힌트2">힌트 2 제공</option><option value="해금">해금 완료</option></select></div><p class="stats" id="stats"></p><section class="grid" id="grid"></section></main><script>const DATA=[[31,"지도에서 지워진 세 번째 마을","세 우물에 비친 별은 같은 세계의 것이 아니다. 지워진 세 번째 마을은 「???」가 최초로 부활 실험을 한 장소이며 왕실이 존재 자체를 삭제했다.","재·우물·같은 날씨를 강조","세 지역 결과의 첫 글자를 이동값 오름차순으로 배열"],[32,"열세 번째 종과 반대 소환진","열두 번의 종이 끝난 뒤의 침묵이 열세 번째 신호다. 이 신호는 왕실 소환진을 반대로 작동시키는 시작음이다.","종의 횟수가 아니라 침묵을 세게 한다","종·시간·침묵 기록에서 비어 있는 순번 확인"],[33,"한 자루였던 반천 반악","반천과 반악은 원래 세계의 균형을 지키던 하나의 검이었다. 빛과 어둠을 동시에 거부한 첫 주인 때문에 두 성질로 갈라졌다.","직업 이름보다 이름 없는 무기를 먼저 제시","반대 성향 단서 둘과 이름 없는 검 기록 확보"],[34,"죽은 별을 먹는 세계수","세계수의 가장 깊은 뿌리는 부활할 힘이 남은 죽은 별에서 생명력을 끌어온다. 이 힘이 뒤틀리면 언데드와 부활 현상이 생긴다.","숲·날씨·부활의 마지막 단어를 보게 한다","세 기록의 마지막 단어를 역순으로 조합"],[35,"공허의 거울 뒤 감시자","공허는 플레이어를 비추는 것이 아니라 그 뒤에서 지켜보는 「???」의 그림자를 본다. 공허족의 방어 무시는 그 그림자의 법칙을 일부 거부하는 힘이다.","공허족이 아닌 장소의 방어 무시 흔적 제공","서로 다른 장소의 방어 무시 기록 3개"],[36,"고대 용족이 잊은 무명소거","고대 용족이 잃어버린 주문은 무명소거다. 마법을 파괴하는 것이 아니라 세계가 그 마법의 이름을 기억하지 못하게 만든다.","서로 다른 속성 주문의 등장 순서를 강조","마법 흔적 4개와 고대 용족 각성 기록 연결"],[37,"깊은 모루가 만든 최초의 열쇠","깊은 모루는 무기를 만들기 전에 부활의 문을 잠그는 최초의 열쇠를 제작했다. 현재의 최강 장비 제작법은 그 열쇠를 복원하는 과정이다.","성공보다 실패 제작 기록을 보여 준다","제작하지 않은 날·실패 제작·보스 재료 배열 확인"],[38,"이름을 거부한 길잡이 펫","이 히든 펫은 이름이 정해지는 순간 길을 찾는 힘을 잃는다. 운영자는 해금 전까지 이름을 공개하지 않고 그림과 능력만 보여 준다.","펫의 시선 방향과 지역 날씨만 제공","이름 없는 펫의 그림·능력·발견 지역 공통점 확인"],[39,"최초 소환자의 삭제된 명부","현재 전 용사는 과거 왕실이 처음 소환했던 이세계인이다. 왕은 실패를 숨기기 위해 명부를 지웠고 이후 그를 이 세계 출신 용사로 발표했다.","명부를 지운 날짜의 모순을 보여 준다","왕실 기록·전 용사 인장·이전 소환 흔적 대조"],[40,"태어나지 않은 왕의 무덤","빈 무덤은 미래에서 과거로 보내진 기록이다. 현재 왕의 후계자가 부활의 고리를 끊지 못한 시간선에서 만들어졌다.","묘비 날짜와 현재 왕가의 연표를 비교하게 한다","31~39 조각을 실제 발견 순서로 연결"],[41,"반천과 반악이 갈라진 밤","빛과 어둠을 함께 품은 검은 왕실의 봉인실에서 처음 발견되었다. 검을 잡은 자의 그림자는 두 방향으로 갈라졌지만 어느 쪽도 주인을 따라가지 않았다.","반천 반악·히든 직업","빛 계열 기록과 어둠 계열 기록의 서로 다른 숫자를 순서가 아닌 발견 장소로 정렬"],[42,"탐험가에게만 보이는 초대장","이벤트는 공고로 시작되지 않는다. 같은 지역을 여러 번 지나도 포기하지 않은 자의 인벤토리에 이름 없는 초대장이 생긴다.","탐험 이벤트·히든 힌트","아무 일 없음 결과 사이에 반복되는 한 문장을 찾기"],[43,"궁극의 물약을 지키는 약속","모든 능력을 잠시 극한으로 끌어올리는 물약은 한 병만 존재한다. 병을 만든 자는 사용자가 힘을 얻는 72시간 동안 자신의 시간을 잃었다.","궁극의 물약·유일무이","세 마을의 약품 기록에서 판매되지 않는 재료만 고르기"],[44,"엘프의 숲이 시험하는 마음","숲의 문은 힘이 아니라 선택을 시험한다. 드루이드의 길은 쓰러진 나무를 베지 않고 되살린 자에게만 열린다.","드루이드·서브 마을 퀘스트","전투 보상이 없는 선택지 세 개를 같은 날 완료"],[45,"멈춰 버린 시간의 파편","시간술사의 흔적 주변에서는 이동값이 줄지 않고 같은 숫자가 두 번 기록된다. 파편은 시간을 되돌리지 않고 놓친 선택만 보여 준다.","시간술사·시간 파편","동일 D100 결과가 나온 두 기록의 날씨 차이를 계산"],[46,"피로 쓰인 계약서","혈기사는 생명력을 힘으로 바꾸지만 계약서의 마지막 줄은 자신의 피로만 나타난다. 혈왕의 이름은 체력이 가장 낮은 순간에 읽힌다.","혈기사·혈왕","회복 전에 남은 HP와 사용 기술의 순서를 기록"],[47,"공간이 접힌 방","공간술사가 지나간 방은 문이 네 개지만 어느 문으로 나가도 같은 자리로 돌아온다. 단 하나, 뒤로 걸어간 자만 다른 하늘을 본다.","공간술사·공간의 초월자","이동 결과를 역순으로 세 번 적용한 좌표 없는 경로"],[48,"용이 인정한 후계자","용혈전사는 용을 쓰러뜨려 인정받지 않는다. 죽일 수 있는 순간 공격을 멈춘 자에게 용왕의 후계자 표식이 남는다.","용혈전사·용왕의 후계자","용족 보스 전투의 마지막 행동을 공격 이외로 끝내기"],[49,"별이 선택하지 않은 관측자","별의 관측자는 가장 밝은 별이 아니라 사라진 별을 기록한다. 성좌의 대행자는 존재하지 않는 별자리의 마지막 점이 된다.","별의 관측자·성좌","검게 변한 별 기록에서 빠진 순번 확인"],[50,"심연이 돌려준 이름","심연술사가 자신의 이름을 말하면 균열은 다른 이름으로 대답한다. 그 이름을 세 번 듣고도 따라가지 않은 자만 계승자가 된다.","심연술사·심연의 계승자","가짜 목소리 세 개의 공통되지 않는 단어 찾기"],[51,"인간이 잊은 첫 번째 용기","인간의 저주는 두려움 때문에 생긴 것이 아니라 전 용사의 도주를 모든 인간이 대신 기억하게 된 결과다.","인간·공포의 저주","세 강대한 보스 앞에서 감소한 능력치의 공통 나머지 확인"],[52,"엘프의 나무가 기억하는 전쟁","세계수의 나이테에는 과거의 보스전이 새겨져 있다. 잘린 나이테 하나는 아직 일어나지 않은 전투를 보여 준다.","엘프·세계수","엘프의 숲 날씨 네 종류를 계절 순서가 아닌 나이테 수로 정렬"],[53,"깊은 모루의 마지막 장인","드워프의 전설 이상 제작 능력은 축복이 아니라 마지막 장인이 남긴 미완성 망치의 계약이다.","드워프·전설 제작","실패 제작 기록과 성공 제작 기록에서 사라진 재료 비교"],[54,"달빛을 쫓는 수인의 발자국","수인은 날씨가 바뀌기 직전의 냄새를 기억한다. 같은 발자국이 두 지역에 동시에 나타날 때 히든 길이 열린다.","수인·감각","서로 다른 지역에서 같은 이동값과 다른 날씨 기록 수집"],[55,"오크가 지키는 패배의 깃발","오크의 깃발은 승리한 전장이 아니라 끝까지 물러서지 않은 패배의 장소에 세워진다.","오크·전투 각성","패배 후 도주하지 않고 동료를 살린 기록 확인"],[56,"용인이 듣는 낮은 포효","용인은 자신보다 낮은 혈통에게 강해지지만 진짜 각성은 자신보다 강한 용의 포효를 견딘 뒤 시작된다.","용인·공격력 증가","상위 용족 조우에서 첫 턴을 방어로 버티기"],[57,"정령족의 비어 있는 이름","정령족은 태어난 날의 날씨로 이름을 얻는다. 존재하지 않는 날씨에서 태어난 정령은 세계의 균열과 연결된다.","정령족·날씨","날씨 도감에 없는 현상을 두 지역에서 목격"],[58,"불사자가 피하는 무덤","불사자는 죽음을 두려워하지 않지만 이름이 적힌 빈 무덤만은 피한다. 그 무덤은 부활이 시작되기 전부터 존재했다.","불사자·부활","빈 무덤과 보스 부활 시각의 차이를 계산"],[59,"고대 용족의 잃어버린 주문","모든 마법을 사용할 수 있는 고대 용족도 단 하나의 주문은 기억하지 못한다. 그 주문은 마법을 만드는 것이 아니라 지운다.","고대 용족·모든 마법","마법 도감의 속성 수와 봉인 기록의 빈칸 비교"],[60,"공허족 위에 없는 왕좌","가장 높은 종족인 공허족의 왕좌는 비어 있다. 왕좌 뒤에는 방어력이라는 개념이 존재하기 전의 전투가 새겨져 있다.","공허족·방어 무시","방어력 0이 아닌데 피해가 같은 세 전투 비교"],[61,"검사가 들은 두 번째 칼소리","검사의 검이 적에게 닿기 전 두 번째 칼소리가 들렸다. 미래의 자신이 같은 공격을 먼저 사용한 흔적이었다.","검사·전직","같은 기술 피해가 다른 두 전투의 선공값 비교"],[62,"수호자의 깨지지 않는 방패","수호자의 방패에는 막은 공격이 아니라 지키지 못한 이름이 새겨진다. 이름이 모두 채워지면 방패는 공격을 거부한다.","수호자·보호","동료 대신 받은 피해 기록에서 이름의 첫 글자 수집"],[63,"사제가 치료하지 못한 상처","사제의 회복으로도 사라지지 않는 검은 상처는 육체가 아니라 부활 기록에 생긴 손상이다.","사제·회복","회복 후에도 남은 상태 이상과 부활 횟수 연결"],[64,"격투가의 지워지는 힘","격투가는 쿨타임이 없지만 같은 힘을 반복할수록 세계가 동작을 기억해 피해를 줄인다.","격투가·피로","연속 사용 피해 감소율에서 반복되지 않은 숫자 찾기"],[65,"마법사가 배워야 하는 이유","마법은 태어날 때 주어지지 않는다. 습득한 주문만 사용할 수 있으며 직업과 맞는 속성은 영혼의 공명을 일으킨다.","마법사·마법 습득","직업 속성과 습득 순서가 일치하는 주문의 첫 글자"],[66,"네크로맨서가 거부한 시체","네크로맨서조차 일으킬 수 없는 시체가 있다. 보스가 부활할 때마다 그 시체만 더 오래 썩어 간다.","네크로맨서·언데드","부활하지 않은 시체와 세계수 기록 연결"],[67,"창시자가 심은 마지막 씨앗","드루이드의 끝에 선 창시자는 세계수를 새로 만들지 않는다. 죽은 세계가 스스로 싹을 틔울 장소를 남긴다.","창시자·세계수의 심판","언데드 전투와 숲 회복 기록의 반대 결과 조합"],[68,"마법 도감에서 사라진 주문","스킬 도감에서 마법사 기술이 사라진 날, 마법 도감의 빈 페이지가 스스로 글자를 쓰기 시작했다.","마법 도감·스킬 분리","두 도감의 같은 위치에서 서로 다른 단어 확인"],[69,"선공 주사위의 일곱 번째 면","선공과 실패는 D6으로 판정하지만 오래된 주사위에는 보이지 않는 일곱 번째 면의 긁힌 자국이 있다.","D6 판정·숨은 결과","선공과 실패가 같은 값인 전투 여섯 번의 행동 순서 기록"],[70,"배우지 않은 기술의 주인","전투 중 등록되지 않은 기술이 한 번 사용됐다. 피해 기록에는 플레이어 이름도 몬스터 이름도 남지 않았다.","전투 스킬·미확인 기술","스킬 사용 기록의 빈 사용자 칸과 날씨 시간 대조"],[71,"D100이 가리킨 백 번째 길","이동 주사위 100은 가장 먼 이동이 아니라 현재 세계의 끝을 한 번 건너뛰는 값이다.","D100 이동·100","100 이동 후 아무 일 없음 결과를 받은 기록 확인"],[72,"아무 일도 없었던 장소","아무 일 없음은 빈 결과가 아니다. 같은 장소에서 세 번 아무 일도 없으면 세계가 숨긴 흔적이 겹쳐 보인다.","이동 결과·아무 일 없음","동일 조건의 빈 결과 세 장을 겹쳐 읽기"],[73,"일반 몬스터가 가진 왕의 문장","평범한 몬스터 한 마리에게 왕실 인장이 찍혀 있었다. 인장은 플레이어 소환보다 오래된 것이었다.","일반 몬스터·왕실","일반 드롭 중 판매가가 없는 물건 확인"],[74,"희귀 몬스터가 숨긴 지도","희귀 몬스터의 가죽 안쪽에는 지도 일부가 새겨져 있다. 조각은 좌표가 아니라 이동 숫자로만 이어진다.","희귀 몬스터·지도","네 지역의 D100 값을 작은 순서로 연결"],[75,"상자가 기억한 주인","보물상자는 열쇠보다 먼저 주인을 선택한다. 등급이 높은 상자일수록 이전에 열었던 자의 목소리를 오래 기억한다.","상자 도감·등급","상자 연출의 색과 재료 교환권 등급 비교"],[76,"교환권에 찍힌 없는 상점","재료 교환권 뒷면에는 지도에 없는 상점의 도장이 있다. 그 상점은 날씨가 없는 날에만 문을 연다.","재료 교환권·상점","마을별 물약 상점 목록에 없는 판매 항목 찾기"],[77,"귀환서가 돌아가지 못한 밤","귀환서를 사용했지만 플레이어는 마을이 아닌 처음 소환된 지하에 도착했다. 인벤토리에는 사용하지 않은 귀환서가 그대로 남았다.","귀환서·인벤토리","소모되지 않은 사용 기록과 왕실 균열 시각 비교"],[78,"이름 없는 히든 펫","다섯 히든 펫 중 하나는 그림만 남고 이름이 없다. 그것은 주인을 따라오는 대신 다음 히든 지역을 먼저 발견한다.","히든 펫·랜덤 확률","그림의 방향과 발견 지역의 날씨를 조합"],[79,"예순 마리 펫의 같은 꿈","펫 60종이 같은 밤에 같은 방향을 바라봤다. 꿈속에서 들린 소리는 보스가 부활할 때의 울음과 같았다.","펫 도감 60종·부활","펫 능력의 발동 문구에서 반복되는 단어 세 개 찾기"],[80,"경계에서 사라진 상자","최종 지역 경계에는 일반·희귀 몬스터 상자가 나타나지 않는다. 사라진 상자들은 다른 시간의 경계에 쌓여 있다.","경계·상자 제외","경계 결과표에서 비어 있는 확률 구간을 역산"],[81,"운명의 룰렛이 멈추지 않는 이유","오늘 사용 제한이 사라진 뒤 룰렛은 누군가 돌리지 않아도 밤마다 한 칸씩 움직인다.","운명의 룰렛·제작 재료","자정 전후 재료 등급 위치 차이 확인"],[82,"네 등급 재료의 다섯 번째 색","노멀·중간·상급·전설 재료를 겹치면 목록에 없는 다섯 번째 색이 나타난다.","제작 재료 4등급","네 교환권의 테두리 색을 제작 순서로 배열"],[83,"최종보스 재료로 만든 두 번째 최강","모든 최종보스 재료를 합친 장비는 사용자를 강하게 만드는 동시에 부활의 문 하나를 잠근다.","최강 아이템 2·장비","최종보스 재료 이름의 마지막 글자 조합"],[84,"중간보스 재료로 만든 세 번째 최강","모든 중간보스 재료를 합친 목걸이와 반지는 강화할 수 없지만 잊힌 기억을 보존한다.","최강 아이템 3·장신구","강화 불가 장비의 기본 수치에서 공통 배수 찾기"],[85,"강화석이 깨질 때 들리는 말","장비 강화 실패 시 깨진 강화석은 짧은 문장을 남긴다. 성공만 반복한 자는 그 문장을 들을 수 없다.","장비 강화·실패","서로 다른 강화 단계 실패 문구 수집"],[86,"처음부터 주인을 기다린 장비","몬스터에게서 나온 장비가 인벤토리에 같은 종류가 없으면 바로 장착되는 것은 장비가 주인을 기억하기 때문이다.","몬스터 장비·자동 장착","첫 장착 시간과 몬스터 등장 시간의 차이 확인"],[87,"거래할 수 없는 물건","유일무이 아이템과 궁극의 물약은 거래·판매·교환·드롭이 불가능하다. 소유권이 아니라 세계의 기록에 묶여 있기 때문이다.","거래 제한·유일무이","가격이 없는 아이템들의 획득 장소 첫 글자"],[88,"경매장에 나온 힌트","운영자만 등록할 수 있는 경매에 히든 힌트가 올라왔다. 최고 입찰가는 돈이 아니라 플레이어가 포기한 기억이었다.","경매·히든 힌트","낙찰 기록의 실버 차액과 힌트 번호 비교"],[89,"행운의 동전이 잃지 않는 것","행운의 동전 D6은 원금을 잃지 않지만 성공할 때마다 보이지 않는 운을 조금씩 사용한다.","도박장·행운의 동전","10·20·30·40·45·50 사이에서 규칙을 깨는 증가값 찾기"],[90,"시장이 먼저 아는 재앙","주식 가격은 보스 부활 공지보다 먼저 흔들렸다. 누군가 미래의 보스 재료 가치를 알고 거래하고 있다.","주식·시장·화폐","가격 변동 시각과 보스 판정 기록 대조"],[91,"파티에 없는 다섯 번째 이름","네 명의 파티 현황표에 다섯 번째 체력바가 잠시 나타났다. 누구도 초대한 적 없는 존재가 전투 보상을 나눠 가졌다.","파티·현황표","파티 생성 시각과 미등록 피해 기록 비교"],[92,"가까워야 시작되는 결투","PVP는 서로 가까울 때만 가능하지만 한 전투는 거리가 멀어진 뒤에도 끝나지 않았다. 두 사람 사이에 공간이 접혀 있었다.","PVP·거리 조건","이동값 차이와 공간술 흔적을 함께 확인"],[93,"랭킹 1위의 빌린 왕관","1위 칭호는 능력치 한계를 무시하지만 순위에서 내려오면 사라진다. 왕관은 소유자가 아니라 가장 높은 기록을 따른다.","랭킹·1위 칭호","3일 주기 갱신 직전과 직후의 한계 초과 수치 비교"],[94,"평판이 기억하는 선택","평판 보상은 승리보다 목격자가 없는 선택을 더 오래 기억한다. 아무 보상도 받지 않은 행동이 숨은 등급을 올린다.","평판·보상","보상 0인 퀘스트 완료 기록 세 개 수집"],[95,"출석하지 않은 날의 보상","출석과 방치 기록 사이에 플레이어가 접속하지 않은 날의 보상이 하나 존재한다. 누군가 대신 시간을 기록했다.","출석·방치","3일 간격 자동 기록에서 생성 주체가 없는 항목 찾기"],[96,"일반보스 상자 속의 뼈","일반·중간·최종보스 상자에서 장비가 사라지고 보스 재료가 남았다. 재료 하나는 어느 보스에게도 속하지 않는다.","보스 상자·보스 재료","세 등급 상자 재료 목록의 중복되지 않는 조각"],[97,"중간보스가 기억하는 패배","중간보스는 부활할 때 이전 전투의 마지막 기술을 먼저 사용한다. 같은 기술로 두 번 끝내면 세 번째 부활에서 기술이 바뀐다.","중간보스·전투 기억","마지막 기술과 다음 선공 D6 결과 연결"],[98,"최종보스들이 바라보는 한 자리","서로 다른 최종보스는 쓰러질 때 모두 같은 빈 공간을 바라본다. 그곳에는 「???」의 몸이 아니라 그림자가 서 있다.","최종보스·???","최종보스 전투 배경의 공통 방향 확인"],[99,"전 용사의 마지막 거짓말","전 용사는 원래 용사의 무기를 인간 히든 지역의 히든 공간에 남겨 후계자를 기다리게 했다. 「???」에게 패배한 뒤 새로 얻어 사용한 다른 무기가 이후 부서졌으며, 이 부서진 새 무기는 세계의 종결자 제작 재료가 된다. 그가 가지고 달아난 것은 「???」의 힘 절반이었다.","전 용사·숨겨진 목적","도주 경로·인간 저주·용사의 무기·부서진 새 무기·반대 소환진을 하나의 문장으로 해독"],[100,"백 번째 기록 · 두 세계의 선택","모든 기록이 모이면 플레이어는 「???」를 쓰러뜨리는 것과 원래 세계로 돌아가는 것 중 하나만 선택해야 한다. 그러나 31~99의 히든 기록을 모두 해독하면 두 선택 사이에 존재하지 않던 세 번째 길이 열린다.","최종 진실·세 번째 결말","히든 기록 69개를 발견 순서대로 연결하고 운영자 도감의 최종 봉인을 해제"]],KEY='ourRpgStoryOpsV1',saved=JSON.parse(localStorage.getItem(KEY)||'{}'),grid=document.querySelector('#grid'),q=document.querySelector('#q'),filter=document.querySelector('#filter');function render(){const term=q.value.trim().toLowerCase(),f=filter.value;grid.innerHTML='';let shown=0;DATA.forEach(r=>{const state=saved[r[0]]||'잠김',hay=r.join(' ').toLowerCase();if(term&&!hay.includes(term)||f!=='all'&&state!==f)return;shown++;const e=document.createElement('article');e.className='card';e.innerHTML='<div class="top"><span class="num">'+r[0]+'</span><div class="title"><h2>'+r[1]+'</h2><small>'+r[3]+'</small></div><select class="state"><option>잠김</option><option>힌트1</option><option>힌트2</option><option>해금</option></select></div><div class="truth"><b>실제 진실</b><br>'+r[2]+'</div><div class="hints"><div class="hint"><b>1단계 힌트</b><br>'+r[3]+'</div><div class="hint"><b>2단계·해금 조건</b><br>'+r[4]+'</div></div><div class="actions"><button class="copy">디스코드 공개문 복사</button></div>';const s=e.querySelector('.state');s.value=state;s.onchange=()=>{saved[r[0]]=s.value;localStorage.setItem(KEY,JSON.stringify(saved));render()};e.querySelector('.copy').onclick=async()=>{const msg='[세계 이야기 '+r[0]+'장 해금]\n'+r[1]+'\n\n'+r[2];try{await navigator.clipboard.writeText(msg);alert('복사했습니다.')}catch(err){prompt('복사하세요.',msg)}};grid.append(e)});document.querySelector('#stats').textContent='표시 '+shown+'장 / 전체 '+DATA.length+'장'}q.oninput=render;filter.onchange=render;render();</script></body></html>
