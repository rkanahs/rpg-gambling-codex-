<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>우리들의 RPG · 운영자 도감 v22</title><style>html,body,#c{margin:0;width:100%;height:100%;border:0;background:#09100f}body{overflow:hidden}</style></head><body><iframe id="c" src="operator-v20.html?base=v22"></iframe><script type="module">import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getDatabase,ref,get}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';const cfg={apiKey:'AIzaSyCn628-H2aDfeklQSdFk4HIc9VqCJow7SM',authDomain:'our-rpg-ranking.firebaseapp.com',databaseURL:'https://our-rpg-ranking-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'our-rpg-ranking',storageBucket:'our-rpg-ranking.firebasestorage.app',messagingSenderId:'811937381072',appId:'1:811937381072:web:e744ad1f00659dce363cd5'},OWNER='040901woo@gmail.com',app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider(),frame=document.getElementById('c');provider.setCustomParameters({prompt:'select_account'});let d,form,select,addBtn,cloudBtn,hint,rows=[];function n(v,x){v=Number(v);return Number.isSafeInteger(v)&&v>=0?v:x}function add(map,x,source){let name=String(x.characterName||x.playerName||x.character||'').trim(),key=name.toLocaleLowerCase('ko-KR');if(!name)return;map.set(key,{name,player:String(x.playerName||'').trim(),hp:Math.max(1,n(x.hpMax,n(x.health,100))),atk:n(x.attack,10),mag:n(x.magic,10),def:n(x.defense,5),spd:n(x.speed,10),level:n(x.level,1),race:String(x.race||''),job:String(x.advancement||x.job||''),source})}function localRows(map){try{(JSON.parse(localStorage.getItem('our-rpg-player-profiles-v2')||'{}').profiles||[]).forEach(p=>add(map,p.data||{},'이 기기 현황표'))}catch(e){}try{(JSON.parse(localStorage.getItem('rpgOperatorRankingsV1')||'[]')).forEach(x=>add(map,x,'운영자 랭킹'))}catch(e){}}function render(map){rows=Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name,'ko'));select.replaceChildren();rows.forEach((x,i)=>{let o=d.createElement('option');o.value=i;o.textContent=x.name+' · Lv.'+x.level+' · HP '+x.hp+' · '+x.source;select.append(o)});if(!rows.length){let o=d.createElement('option');o.textContent='등록된 플레이어가 없습니다';select.append(o)}addBtn.disabled=!rows.length;hint.textContent=rows.length?rows.length+'명의 플레이어를 불러왔습니다.':'플레이어가 온라인 현황표에서 등록해야 합니다.'}async function loadCloud(){if(!auth.currentUser||auth.currentUser.email!==OWNER){await signInWithPopup(auth,provider);return}cloudBtn.disabled=true;cloudBtn.textContent='온라인 목록 불러오는 중…';try{let map=new Map;localRows(map);let snap=await get(ref(db,'playerProfiles')),all=snap.val()||{};Object.values(all).forEach(raw=>{try{let pack=JSON.parse(raw);(pack.profiles||[]).forEach(x=>add(map,x,'온라인 플레이어'))}catch(e){}});render(map);cloudBtn.textContent='온라인 목록 새로고침';hint.textContent=rows.length+'명의 플레이어 · 다른 기기 등록 포함'}catch(e){hint.textContent='온라인 목록을 불러오지 못했습니다. 운영자 계정 로그인을 확인해 주세요.';cloudBtn.textContent='운영자 로그인·온라인 불러오기'}finally{cloudBtn.disabled=false}}function attach(){d=frame.contentDocument;form=d.querySelector('#battleUnitForm');if(!form)return;let s=d.createElement('style');s.textContent='.online-player-load{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:13px;border:1px solid #3d8064;background:#10251e}.online-player-load strong,.online-player-load small{grid-column:1/-1}.online-player-load select,.online-player-load button{min-height:44px}@media(max-width:800px){.online-player-load{grid-template-columns:1fr}.online-player-load strong,.online-player-load small{grid-column:auto}}';d.head.append(s);let b=d.createElement('div');b.className='wide online-player-load';b.innerHTML='<strong>☁️ 다른 기기 플레이어 불러오기</strong><select></select><button class="action-btn" type="button">선택 플레이어 참가</button><button class="action-btn" type="button">운영자 로그인·온라인 불러오기</button><small>플레이어가 온라인 현황표에서 등록한 이름과 능력치를 불러옵니다.</small>';form.prepend(b);[select,addBtn,cloudBtn,hint]=[b.querySelector('select'),...b.querySelectorAll('button'),b.querySelector('small')];let map=new Map;localRows(map);render(map);addBtn.onclick=()=>{let x=rows[Number(select.value)];if(!x)return;form.elements.name.value=x.name;form.elements.team.value='플레이어';form.elements.kind.value='플레이어';form.elements.maxHp.value=x.hp;form.elements.attack.value=x.atk;form.elements.magic.value=x.mag;form.elements.defense.value=x.def;form.elements.speed.value=x.spd;form.elements.note.value=(x.player?x.player+' · ':'')+x.source;form.requestSubmit()};cloudBtn.onclick=loadCloud;onAuthStateChanged(auth,u=>{if(u?.email===OWNER)loadCloud()})}frame.addEventListener('load',attach);</script></body></html>
